<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#efeadf">
    <title>Six Angles on Dry World</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body data-state="boot">
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- Integrated HUD: everything essential lives inside the game view. -->
      <div class="hud-bar hud-left" aria-hidden="true">
        <span class="hud-label">Duel</span>
        <span class="hud-value hud-duel"><b id="duels">01</b><i>/12</i></span>
        <div class="duel-strip" id="pips"></div>
        <p class="hud-sub"><span id="score">0</span> PTS<span id="combo-tag"></span><br>BEST <span id="best-score">0</span></p>
      </div>

      <div class="hud-bar hud-right" aria-hidden="true">
        <div class="hud-cyl" id="cylinder"></div>
        <div class="hud-gunline"><span id="gunname">PEACE MAKER</span><i id="dice">RICO 1-IN-6</i></div>
      </div>

      <div class="hud-bar hud-bottom" aria-hidden="true">
        <div class="meter meter-life"><span class="meter-cap">HIDE</span><div class="meter-track"><div class="meter-fill" id="hide-fill"></div></div></div>
        <div class="meter meter-focus"><span class="meter-cap">FOCUS</span><div class="meter-track"><div class="meter-fill" id="focus-fill"></div></div></div>
      </div>

      <!-- touch controls, shown only on coarse pointers while playing -->
      <div id="touch">
        <button class="tbtn" id="t-left" type="button">&#9664;</button>
        <button class="tbtn" id="t-right" type="button">&#9654;</button>
        <button class="tbtn" id="t-jump" type="button">JUMP</button>
        <button class="tbtn" id="t-fire" type="button">FIRE</button>
      </div>

      <!-- Overlay panels (attract / duel card / results / pause) are injected here. -->
      <div id="overlay"></div>

      <a id="exit" href="../../index.html" title="Back to the arcade index">&larr; ARCADE</a>
    </div>

    <noscript>This game needs JavaScript.</noscript>
    <script src="core.js"></script>
    <script src="art.js"></script>
    <script src="world.js"></script>
    <script src="combat.js"></script>
    <script src="ui.js"></script>
    <script src="game.js"></script>
  </body>
</html>
