<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1800ff">
  <title>Einstein Puzzle</title>
  <link rel="stylesheet" href="style.css">
  <script src="engine.js" defer></script>
  <script src="game.js" defer></script>
</head>
<body>
  <main id="game" aria-label="Einstein Puzzle">
    <header class="titlebar">
      <h1>Einstein Puzzle</h1>
      <time id="clock" aria-label="Elapsed time">00:00:00</time>
    </header>
    <section id="board" aria-label="Puzzle: six rows, six columns"></section>
    <nav id="controls" aria-label="Game controls">
      <button data-action="pause">Pause</button>
      <button data-action="switch" aria-pressed="false">Switch</button>
      <button data-action="exit">Exit</button>
      <button data-action="save">Save</button>
      <button data-action="options">Options</button>
      <button data-action="help">Help</button>
    </nav>
    <div id="tools">
      <button id="tap-mode" title="Toggle select / exclude (X)">Select</button>
      <button id="undo" title="Undo (Ctrl+Z)">Undo</button>
      <span id="status" role="status" aria-live="polite">Left: open. Right: exclude.</span>
    </div>
    <section id="horizontal" aria-label="Horizontal clues"></section>
    <section id="vertical" aria-label="Same-column clues"></section>
  </main>
  <section id="attract" aria-label="Einstein Puzzle main menu">
    <div class="attract-card">
      <p class="eyebrow">FLOWIX CLASSIC / WEB EDITION</p>
      <h2>Einstein Puzzle</h2>
      <p class="tagline">Thirty-six cards. One arrangement. Pure deduction.</p>
      <div id="demo" aria-hidden="true"></div>
      <p class="start-prompt">PRESS ENTER OR CHOOSE NEW GAME</p>
      <div class="menu-buttons">
        <button id="new-game">New game</button>
        <button id="load-game">Load game</button>
        <button id="resume-game" hidden>Resume</button>
        <button id="scores">Top scores</button>
        <button id="menu-help">Rules</button>
        <button id="menu-options">Options</button>
        <button id="about">About</button>
      </div>
      <p class="menu-note">Original cards, clues, textures and sounds. No guessing required.</p>
      <a class="arcade-link" href="../../index.html">Return to game list</a>
    </div>
  </section>
  <dialog id="dialog" aria-labelledby="dialog-title">
    <h2 id="dialog-title"></h2>
    <div id="dialog-body"></div>
    <div id="dialog-actions"></div>
  </dialog>
  <div id="notice" role="alert" hidden></div>
</body>
</html>
