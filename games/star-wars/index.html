<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#050806">
  <title>Star Wars | Vector Arcade</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; height: 100%; min-height: 100svh;
      overflow: hidden; background: #050806; color: #e8e8e8;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
    }
    body { touch-action: none; }
    #game {
      display: block; width: 100vw; height: 100vh; background: #020403;
      cursor: crosshair;
    }
    .overlay {
      position: fixed; inset: 0; z-index: 20; display: grid; place-items: center;
      text-align: center; pointer-events: none;
    }
    .overlay .panel {
      pointer-events: auto; display: inline-flex; flex-direction: column; align-items: center; gap: 14px;
      padding: 24px; border-radius: 12px; background: rgba(5, 8, 6, 0.85);
      border: 1px solid rgba(255, 60, 60, 0.35); backdrop-filter: blur(6px);
    }
    h1 {
      margin: 0; font-size: clamp(48px, 18vw, 110px); letter-spacing: 0.22em; font-weight: 900;
      text-transform: uppercase; color: #ff3b3b;
      text-shadow: 0 0 22px rgba(255, 59, 59, 0.45), 0 0 8px rgba(255, 59, 59, 0.25);
    }
    .start {
      font-size: clamp(16px, 4vw, 24px); letter-spacing: 0.35em; font-weight: 700;
      text-transform: uppercase; color: #ffff00; animation: blink 1.1s ease-in-out infinite;
    }
    .hint {
      font-size: clamp(12px, 3vw, 16px); letter-spacing: 0.2em; color: #98a39b;
      text-transform: uppercase; opacity: 0.85;
    }
    .gameover-title { color: #ff4d4d; text-shadow: 0 0 22px rgba(255, 77, 77, 0.5); }
    @keyframes blink { 0%, 100% { opacity: 1 } 50% { opacity: 0.35 } }
    .hidden { display: none !important; }
    .hud {
      position: fixed; top: 12px; left: 12px; z-index: 20; pointer-events: none;
      display: flex; flex-direction: column; gap: 6px;
    }
    .hud > div {
      font-size: 15px; letter-spacing: 0.18em; font-weight: 700; text-transform: uppercase;
      color: #e8e8e8; text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
    }
    .hud .hi { color: #888; font-size: 12px; }
    .hud .center-reticle {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
      width: 24px; height: 24px; border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 50%; pointer-events: none; z-index: 19;
    }
    .hud .center-reticle::after {
      content: ""; position: absolute; inset: 0; border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 50%; animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.6 } 50% { transform: scale(1.15); opacity: 1 } }
    @media (max-width: 600px) {
      .hud { top: 8px; left: 8px; }
      .hud > div { font-size: 12px; }
      .hud .hi { font-size: 10px; }
    }
  </style>
</head>
<body>
  <canvas id="game"></canvas>

  <div class="overlay" id="attract">
    <div class="panel">
      <h1>STAR WARS</h1>
      <p class="start">PRESS SPACE OR CLICK TO START</p>
      <p class="hint">STEER: &larr; / &rarr; &nbsp; THRUST: &uparrow; &nbsp; FIRE: SPACE</p>
      <p class="hint">DESTROY TIE FIGHTERS. SURVIVE THE TRENCH.</p>
    </div>
  </div>

  <div class="overlay hidden" id="gameover">
    <div class="panel">
      <h1 class="gameover-title">MISSION FAILED</h1>
      <p id="final-score" style="font-size:clamp(18px, 4vw, 24px); letter-spacing:0.25em; font-weight:700; color:#ffff00; text-transform:uppercase;">FINAL SCORE: 000000</p>
      <p class="start">PRESS SPACE OR CLICK TO TRY AGAIN</p>
    </div>
  </div>

  <div class="hud hidden" id="hud">
    <div id="hud-score">SCORE 000000</div>
    <div id="hud-lives">LIVES 3</div>
    <div class="hi" id="hud-hi">HI 000000</div>
    <div class="center-reticle"></div>
  </div>

  <script>
  "use strict";
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d', { alpha: false });
  const elAttract = document.getElementById('attract');
  const elGameOver = document.getElementById('gameover');
  const elHud = document.getElementById('hud');
  const elScore = document.getElementById('hud-score');
  const elLives = document.getElementById('hud-lives');
  const elHi = document.getElementById('hud-hi');
  const elFinal = document.getElementById('final-score');

  let width = 0, height = 0, dpr = 1;
  function resize() {
    dpr = window.devicePixelRatio || 1;
    width = window.innerWidth; height = window.innerHeight;
    canvas.width = Math.max(1, Math.floor(width * dpr));
    canvas.height = Math.max(1, Math.floor(height * dpr));
    canvas.style.width = width + 'px'; canvas.style.height = height + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize, { passive: true });
  resize();

  const STATE = { ATTRACT: 'ATTRACT', PLAYING: 'PLAYING', GAME_OVER: 'GAME_OVER' };
  let state = STATE.ATTRACT;

  const keys = {};
  window.addEventListener('keydown', (e) => {
    if (e.code === 'Space') {
      if (state === STATE.ATTRACT || state === STATE.GAME_OVER) { e.preventDefault(); startGame(); return; }
      e.preventDefault();
    }
    if (e.code === 'ArrowLeft' || e.code === 'ArrowRight' || e.code === 'ArrowUp' || e.code === 'ArrowDown' ||
        e.code === 'KeyW' || e.code === 'KeyA' || e.code === 'KeyS' || e.code === 'KeyD' || e.code === 'Space') {
      e.preventDefault();
    }
    keys[e.code] = true;
  }, { passive: false });
  window.addEventListener('keyup', (e) => { keys[e.code] = false; });

  let pointerShoot = false;
  window.addEventListener('pointerdown', (e) => {
    if (state === STATE.ATTRACT || state === STATE.GAME_OVER) { startGame(); return; }
    pointerShoot = true;
  }, { passive: false });
  window.addEventListener('pointerup', () => { pointerShoot = false; });

  let audioCtx = null;
  function ensureAudio() {
    if (audioCtx) return true;
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audioCtx = null; }
    return !!audioCtx;
  }
  function tone(freq, type, duration, vol, when) {
    if (!audioCtx) return;
    const t = audioCtx.currentTime + (when || 0);
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol || 0.08, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + duration);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + duration);
  }
  function laserSound() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'square';
    osc.frequency.setValueAtTime(880, t);
    osc.frequency.exponentialRampToValueAtTime(220, t + 0.12);
    gain.gain.setValueAtTime(0.1, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.12);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.12);
  }
  function explodeSound() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.5, audioCtx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < data.length; i++) data[i] = (Math.random() * 2 - 1) * Math.exp(-(i / data.length) * 12);
    const noise = audioCtx.createBufferSource();
    noise.buffer = buf;
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.12, t); gain.gain.exponentialRampToValueAtTime(0.001, t + 0.35);
    const filt = audioCtx.createBiquadFilter();
    filt.type = 'lowpass'; filt.frequency.setValueAtTime(600, t); filt.frequency.exponentialRampToValueAtTime(60, t + 0.35);
    noise.connect(filt); filt.connect(gain); gain.connect(audioCtx.destination);
    noise.start(t); noise.stop(t + 0.35);
  }
  function tieHum() {
    if (!audioCtx) return;
    const t = audioCtx.currentTime;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(440, t);
    osc.frequency.linearRampToValueAtTime(880, t + 0.15);
    osc.frequency.linearRampToValueAtTime(440, t + 0.3);
    gain.gain.setValueAtTime(0.05, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(t); osc.stop(t + 0.3);
  }

  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y, a.z - b.z); }
  function pad(n, w) { return String(n).padStart(w, '0'); }
  function isDown(code) { return !!keys[code]; }

  // 3D projection: world (x,y,z) -> screen (sx,sy,scale)
  const FOV = 640;
  function project(x, y, z) {
    const scale = FOV / (FOV + z);
    return {
      sx: width / 2 + x * scale,
      sy: height / 2 + y * scale,
      scale: scale
    };
  }

  let frame = 0;
  let score = 0, lives = 3, level = 1;
  let hiScore = 0;
  try { hiScore = parseInt(localStorage.getItem('sw_starwars_hi') || '0', 10) || 0; } catch (e) { hiScore = 0; }

  // Starfield (3D stars rushing toward the player)
  const STAR_COUNT = 120;
  let stars = [];
  function spawnStar() {
    return {
      x: (Math.random() - 0.5) * width * 1.6,
      y: (Math.random() - 0.5) * height * 1.6,
      z: Math.random() * 1200 + 200,
      sz: 1 + Math.random() * 2
    };
  }
  for (let i = 0; i < STAR_COUNT; i++) stars.push(spawnStar());

  // TIE fighter (wireframe sphere + hexagonal panels)
  class Tie {
    constructor() {
      this.reset(true);
    }
    reset(far) {
      this.x = (Math.random() - 0.5) * 400;
      this.y = (Math.random() - 0.5) * 300;
      this.z = far ? 900 + Math.random() * 800 : 500 + Math.random() * 400;
      this.vz = -(4 + Math.random() * 6 + level * 0.5);
      this.vx = (Math.random() - 0.5) * 0.8;
      this.vy = (Math.random() - 0.5) * 0.8;
      this.angle = Math.random() * Math.PI * 2;
      this.radius = 22 + Math.random() * 14;
      this.alive = true;
      this.shootTimer = 60 + Math.random() * 120;
    }
    update() {
      this.z += this.vz;
      this.x += this.vx;
      this.y += this.vy;
      this.angle += 0.03;
      this.shootTimer--;
      if (this.z < 20) this.alive = false;
    }
    draw() {
      const p = project(this.x, this.y, this.z);
      if (p.scale <= 0) return;
      const r = this.radius * p.scale;
      if (r < 1) return;
      ctx.save();
      ctx.translate(p.sx, p.sy);
      ctx.rotate(this.angle);
      ctx.strokeStyle = '#00ffff';
      ctx.lineWidth = 1.5 * p.scale;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.arc(0, 0, r, 0, Math.PI * 2);
      ctx.stroke();
      for (let s = 0; s < 2; s++) {
        const side = s === 0 ? -1 : 1;
        ctx.beginPath();
        for (let k = 0; k <= 6; k++) {
          const a = (k / 6) * Math.PI * 2;
          ctx.lineTo(Math.cos(a) * r * 0.9 * side, Math.sin(a) * r * 0.45);
        }
        ctx.stroke();
      }
      ctx.restore();
    }
  }

  let ties = [];

  // Laser bolt
  class Laser {
    constructor(x, y, z, vx, vy, vz, owner) {
      this.x = x; this.y = y; this.z = z;
      this.vx = vx; this.vy = vy; this.vz = vz;
      this.owner = owner;
      this.alive = true;
      this.life = 60;
    }
    update() {
      this.x += this.vx; this.y += this.vy; this.z += this.vz;
      this.life--;
      if (this.life <= 0 || this.z < -50) this.alive = false;
    }
    draw() {
      const p = project(this.x, this.y, this.z);
      if (p.scale <= 0) return;
      ctx.save();
      ctx.translate(p.sx, p.sy);
      ctx.strokeStyle = this.owner === 'ship' ? '#ffff00' : '#ff4d4d';
      ctx.lineWidth = 2 * p.scale;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-this.vx * 0.5 * p.scale, -this.vy * 0.5 * p.scale);
      ctx.stroke();
      ctx.restore();
    }
  }

  let lasers = [];
  let particles = [];
  let shootCooldown = 0;
  let tieSpawnTimer = 0;

  function startGame() {
    ensureAudio();
    state = STATE.PLAYING;
    score = 0; lives = 3; level = 1;
    elScore.textContent = 'SCORE ' + pad(score, 6);
    elLives.textContent = 'LIVES ' + lives;
    elHi.textContent = 'HI ' + pad(hiScore, 6);
    elAttract.classList.add('hidden');
    elGameOver.classList.add('hidden');
    elHud.classList.remove('hidden');
    ties = [];
    lasers = [];
    particles = [];
    shootCooldown = 0;
    tieSpawnTimer = 0;
    for (let i = 0; i < 4; i++) ties.push(new Tie());
  }

  function gameOver() {
    state = STATE.GAME_OVER;
    if (score > hiScore) {
      hiScore = score;
      try { localStorage.setItem('sw_starwars_hi', String(hiScore)); } catch (e) {}
    }
    elFinal.textContent = 'FINAL SCORE: ' + pad(score, 6);
    elHud.classList.add('hidden');
    elGameOver.classList.remove('hidden');
  }

  function spawnParticle(x, y, z, color) {
    for (let i = 0; i < 6; i++) {
      particles.push({
        x: x, y: y, z: z,
        vx: (Math.random() - 0.5) * 4,
        vy: (Math.random() - 0.5) * 4,
        vz: (Math.random() - 0.5) * 4,
        life: 20 + Math.random() * 20,
        color: color
      });
    }
  }

  function updatePlaying() {
    frame++;

    // Starfield movement
    const speed = 6 + level * 0.5;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.z -= speed;
      if (s.z < 1) {
        s.x = (Math.random() - 0.5) * width * 1.6;
        s.y = (Math.random() - 0.5) * height * 1.6;
        s.z = 1200;
        s.sz = 1 + Math.random() * 2;
      }
    }

    // Ship input (player is fixed at z=0, steering shifts aim)
    let steer = 0;
    if (isDown('ArrowLeft') || isDown('KeyA')) steer = -1;
    if (isDown('ArrowRight') || isDown('KeyD')) steer = 1;
    const shipX = steer * 120;
    const shipY = 0;
    const shipZ = 0;

    // Shooting
    if (shootCooldown > 0) shootCooldown--;
    if ((isDown('Space') || pointerShoot) && shootCooldown <= 0) {
      shootCooldown = 14;
      laserSound();
      lasers.push(new Laser(shipX, shipY, shipZ, 0, 0, -14, 'ship'));
    }

    // Update lasers
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      l.update();
      if (!l.alive) { lasers.splice(i, 1); continue; }
      // Ship laser hitting a TIE
      if (l.owner === 'ship') {
        for (let j = ties.length - 1; j >= 0; j--) {
          const t = ties[j];
          if (!t.alive) continue;
          const d = dist(l, t);
          if (d < t.radius + 4) {
            t.alive = false;
            l.alive = false;
            explodeSound();
            spawnParticle(t.x, t.y, t.z, '#00ffff');
            score += 100;
            elScore.textContent = 'SCORE ' + pad(score, 6);
            break;
          }
        }
      }
    }

    // Update TIE fighters
    let tieShot = false;
    for (let i = ties.length - 1; i >= 0; i--) {
      const t = ties[i];
      t.update();
      if (!t.alive) { ties.splice(i, 1); continue; }

      // TIE collision with player (z near 0 and close in x/y)
      if (Math.abs(t.z) < 40 && Math.hypot(t.x - shipX, t.y - shipY) < t.radius + 60) {
        t.alive = false;
        explodeSound();
        spawnParticle(t.x, t.y, t.z, '#ff4d4d');
        lives--;
        elLives.textContent = 'LIVES ' + lives;
        if (lives <= 0) { gameOver(); return; }
        continue;
      }

      // TIE fires at player
      if (t.shootTimer <= 0 && !tieShot) {
        t.shootTimer = 80 + Math.random() * 100;
        const dx = shipX - t.x;
        const dy = shipY - t.y;
        const dz = shipZ - t.z;
        const len = Math.hypot(dx, dy, dz) || 1;
        lasers.push(new Laser(t.x, t.y, t.z, dx / len * 6, dy / len * 6, dz / len * 6, 'tie'));
        tieHum();
        tieShot = true;
      }
    }

    // Update enemy lasers hitting player
    for (let i = lasers.length - 1; i >= 0; i--) {
      const l = lasers[i];
      if (l.owner !== 'tie') continue;
      const d = Math.hypot(l.x - shipX, l.y - shipY, l.z - shipZ);
      if (d < 30) {
        l.alive = false;
        explodeSound();
        spawnParticle(l.x, l.y, l.z, '#ff4d4d');
        lives--;
        elLives.textContent = 'LIVES ' + lives;
        if (lives <= 0) { gameOver(); return; }
      }
    }

    // Update particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.z += p.vz;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }

    // Spawn new TIE fighters
    tieSpawnTimer--;
    if (tieSpawnTimer <= 0 && ties.length < 4 + Math.min(level, 4)) {
      ties.push(new Tie());
      tieSpawnTimer = 60 + Math.random() * 80 - level * 4;
    }
    if (ties.length === 0) {
      level++;
      for (let i = 0; i < 3 + Math.min(level, 5); i++) ties.push(new Tie());
    }
  }

  function updateAttract() {
    frame++;
    const speed = 4;
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      s.z -= speed;
      if (s.z < 1) {
        s.x = (Math.random() - 0.5) * width * 1.6;
        s.y = (Math.random() - 0.5) * height * 1.6;
        s.z = 1200;
        s.sz = 1 + Math.random() * 2;
      }
    }
    // Slowly rotate a TIE in the distance
    if (ties.length === 0) ties.push(new Tie());
    for (let i = ties.length - 1; i >= 0; i--) {
      const t = ties[i];
      t.z += 0.5;
      t.x = Math.sin(frame * 0.02) * 150;
      t.y = Math.cos(frame * 0.02) * 80;
      t.angle += 0.02;
      if (t.z > 1400) { ties.splice(i, 1); ties.push(new Tie()); }
    }
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx; p.y += p.vy; p.z += p.vz;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
  }

  function drawStars() {
    ctx.fillStyle = '#d4e8d4';
    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      const p = project(s.x, s.y, s.z);
      if (p.scale <= 0) continue;
      ctx.globalAlpha = 0.4 + Math.sin(frame * 0.05 + i) * 0.4;
      ctx.fillRect(p.sx, p.sy, s.sz * p.scale, s.sz * p.scale);
    }
    ctx.globalAlpha = 1;
  }

  function drawGameWorld() {
    for (const t of ties) t.draw();
    for (const l of lasers) l.draw();
    for (const p of particles) {
      const pp = project(p.x, p.y, p.z);
      if (pp.scale <= 0) continue;
      ctx.save();
      ctx.translate(pp.sx, pp.sy);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = 2 * pp.scale;
      ctx.globalAlpha = 0.9;
      ctx.beginPath();
      ctx.moveTo(0, 0);
      ctx.lineTo(-p.vx * 0.5 * pp.scale, -p.vy * 0.5 * pp.scale);
      ctx.stroke();
      ctx.restore();
    }
  }

  function draw() {
    ctx.clearRect(0, 0, width, height);
    drawStars();
    drawGameWorld();
  }

  function update() {
    if (state === STATE.PLAYING) updatePlaying();
    else updateAttract();
    draw();
  }

  function loop() {
    update();
    requestAnimationFrame(loop);
  }

  requestAnimationFrame(loop);
  </script>
</body>
</html>
