<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#111714">
    <title>Playfield | Arcade Index</title>
    <link rel="stylesheet" href="styles.css">
    <script src="games.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <canvas class="attract-art" id="attract-art" aria-hidden="true"></canvas>
    <div class="screen-wash" aria-hidden="true"></div>

    <header class="topbar">
      <a class="wordmark" href="#home" aria-label="Playfield home">
        <span class="wordmark-mark" aria-hidden="true">P</span>
        <span>PLAYFIELD</span>
      </a>
      <div class="topbar-meta">
        <span class="live-dot" aria-hidden="true"></span>
        <span id="header-count">ARCADE INDEX / 00 TITLES</span>
      </div>
      <button class="topbar-button" id="fullscreen-button" type="button" aria-label="Enter fullscreen">Fullscreen</button>
    </header>

    <main id="home" class="main-stage">
      <section class="view attract-view" id="attract-view" aria-labelledby="attract-title">
        <div class="attract-copy">
          <p class="eyebrow"><span>01</span> / THE ARCADE IS OPEN</p>
          <h1 id="attract-title">WHAT ARE<br>WE PLAYING<span class="title-period">?</span></h1>
          <div class="attract-actions">
            <button class="primary-button" id="browse-button" type="button">
              <span>Browse games</span>
              <span class="button-arrow" aria-hidden="true">&#8594;</span>
            </button>
            <span class="action-note">PLAYFIELD <span class="note-slash">/</span> GAME SELECT</span>
          </div>
        </div>
        <div class="scene-readout" aria-hidden="true">
          <span>SIMULATION</span>
          <span class="readout-value">RUNNING</span>
        </div>
        <div class="bottom-rail" aria-hidden="true">
          <span>SELECT YOUR NEXT RUN</span>
          <span class="rail-line"></span>
          <span>PF / 001</span>
        </div>
      </section>

      <section class="view library-view" id="library-view" aria-labelledby="library-title" hidden>
        <div class="library-heading">
          <div>
            <p class="eyebrow"><span>02</span> / ARCADE INDEX</p>
            <h1 id="library-title">THE LINEUP<span class="title-period">.</span></h1>
          </div>
          <button class="back-button" id="back-button" type="button">
            <span aria-hidden="true">&#8592;</span> Attract screen
          </button>
        </div>
        <div class="library-rule" aria-hidden="true"><span id="library-count">00 GAMES</span></div>
        <div class="game-list" id="game-list" aria-live="polite"></div>
      </section>
    </main>

    <script>
      document.documentElement.classList.add("js-ready");
    </script>
  </body>
</html>
